[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awwl"
version = "0.1.0"
description = "Adaptive Wavelet-Weighted Loss for diffusion-model fine-tuning (DreamBooth + DDPM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AWWL authors" }]
keywords = ["diffusion", "wavelet", "dreambooth", "ddpm", "stable-diffusion"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "torchvision",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.28",
    "datasets>=2.18",
    "pytorch-wavelets>=1.3.0",
    # pytorch-wavelets imports pywt but does not declare it, so a fresh
    # install resolves without PyWavelets and then fails at import time.
    "PyWavelets>=1.4",
    "Pillow",
    "numpy",
    "pandas",
    "tqdm",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
eval = [
    "clean-fid>=0.1.35",
    "torch-fidelity>=0.3.0",
    "prdc",
    "scipy",
]
plot = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
awwl = "awwl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# E501 — handled by black.
# N812 — `import torch.nn.functional as F` is a universal convention.
# N803 / N806 — uppercase X, Y, K matrices match standard math notation
#   (e.g. KID kernel matrices); refusing them is academic-code-hostile.
# B008 — typer requires `typer.Option(...)` calls in argument defaults;
#   this is how the CLI library is intended to be used.
ignore = ["E501", "N812", "N803", "N806", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
