# AWWL via from-scratch DDPM fine-tune on CIFAR-10 (AWWL-Diff).
_base_: base.yaml

method: finetune

model:
  # The DDPM UNet is built from these dims when training from scratch.
  image_size: 32
  in_channels: 3
  out_channels: 3
  layers_per_block: 2
  block_out_channels: [128, 256, 256, 256]
  down_block_types: [DownBlock2D, DownBlock2D, DownBlock2D, DownBlock2D]
  up_block_types: [UpBlock2D, UpBlock2D, UpBlock2D, UpBlock2D]
  # Resume / fine-tune from a saved checkpoint folder.
  model_weights_path: null

data:
  # 'cifar10', any HuggingFace hub id, or a local image folder. Changing this
  # (plus image_size / model.image_size) is all a new resolution needs.
  dataset_name: cifar10
  split: train
  image_size: 32
  batch_size: 128
  num_workers: 4

  # CIFAR-10 only. 'auto' reads from the Hub and falls back to the local
  # torchvision copy if the Hub is unreachable or rejects the dataset id.
  # Pin to 'torchvision' for offline runs, or 'hf' when a table must state
  # exactly where its data came from.
  source: auto
  root: ./data

train:
  num_epochs: 200
  learning_rate: 2.0e-4
  lr_warmup_steps: 500
  # Sampling checkpoints. At 40 this yields epochs 39/79/119/159/199, the
  # points the convergence-curve experiment evaluates.
  save_model_epochs: 40
  grad_clip_norm: 1.0

  # Crash recovery. Full training state (optimiser, LR schedule, EMA, RNG) is
  # written every `save_state_epochs` and picked up automatically on restart,
  # so a killed run continues rather than starting over. A CIFAR-10 epoch is
  # about a minute, so 5 bounds the work lost by a crash at ~5 minutes.
  resume: true
  save_state_epochs: 5
  keep_last_states: 2

  # Exponential moving average of the weights. OFF by default because the
  # paper's numbers were produced without it — but standard DDPM training
  # samples from the EMA copy, and enabling it moves every metric, so runs
  # with and without must be reported as separate configurations.
  use_ema: false
  ema_decay: 0.9999

scheduler:
  num_train_timesteps: 1000

loss:
  # Paper-optimal config for CIFAR-10 unconditional generation
  # (Table 2, "Proposed" row: alpha=0.2, p=1.0). Low-resolution images rely
  # on high-frequency detail for identity, so alpha is biased toward
  # detail bands here, in contrast to DreamBooth (alpha=0.8).
  name: adaptive_wavelet
  alpha: 0.2
  power: 1.0
  wavelet_type: db1
  levels: 1
  weighting: normalized   # paper eqs. (4)-(5).

  # Eqs. (4)-(5) do not sum to a constant: the total weight runs from alpha at
  # high noise to (1-alpha) at low noise, so alpha is also a global timestep
  # reweighting. Setting this to true fixes the total at 1 for every sigma,
  # isolating the frequency balance. False reproduces the paper.
  normalize_weights: false

  # How the three detail bands combine. "mean" is what the released code does
  # and what produced the paper's tables; "sum" is what eq. (7) literally
  # writes. They differ by a factor of 3 on the detail term — see
  # scripts/verify_loss_math.py.
  detail_reduction: mean
  level_reduction: sum

output:
  dir: ./runs/finetune
