# Phase 0 — "does the effect survive multiple seeds?"
#
# The published CIFAR-10 table separates MSE (16.68), AWWL (16.62) and the
# static wavelet variant (16.55) by less than a tenth of a FID point, from one
# seed each. Seed-to-seed spread for this recipe is typically several times
# that, so before any Q1 extension is worth compute, the sweep below has to
# establish that there is an effect to extend.
#
# Tiers run in order and the runner drains one before starting the next, so a
# budget cut simply means stopping after a tier rather than half-finishing
# everything:
#
#   tier 1  the survival test + convergence curves          15 runs
#   tier 2  the alpha confound, eq.(7) form, and EMA        16 runs
#   tier 3  the remaining published baselines               25 runs
#
# Rough cost on 2x RTX 5000 Ada (one run per GPU, no DDP): ~3 h per training
# run, ~6 min per 10k-image DDIM-100 sample set, a few minutes per metric
# pass. Tier 1 lands in about a day, all three tiers in roughly four.
#
# Prerequisite (once):   awwl prepare-data --output ./data/cifar10_train_png
# Run (repeatable):      awwl pipeline run -m configs/pipeline/phase0.yaml --gpus 0,1
# Inspect:               awwl pipeline status -m configs/pipeline/phase0.yaml
#
# Re-running after a crash is the intended workflow, not a recovery procedure:
# finished jobs are skipped and interrupted ones resume from their own last
# checkpoint.

name: phase0
base_config: configs/finetune.yaml
output_root: ./runs/phase0
ledger: ./runs/phase0/results.jsonl
real_images: ./data/cifar10_train_png

defaults:
  seeds: [1, 2, 3, 4, 5]
  # Only the final checkpoint by default; tier 1 overrides this to trace the
  # whole curve, which is what answers "does AWWL reach a given FID earlier?"
  eval_epochs: [199]
  sample:
    num_samples: 10000
    sampler: ddim         # DDIM-100 over DDPM-1000: ~10x cheaper, and the
    steps: 100            # comparison is internally consistent either way.
    batch_size: 256       # Never mix samplers within one table.
    seed: 12345
  overrides:
    train.num_epochs: 200
    train.save_model_epochs: 40

experiments:

  # ---------------------------------------------------------------- tier 1
  # Three configurations, five seeds, evaluated at five checkpoints each.
  # Answers two questions at once: is the AWWL-vs-MSE gap larger than seed
  # noise, and does AWWL converge faster (an independent, compute-saving
  # claim that does not depend on winning on final FID).

  - group: mse
    tier: 1
    eval_epochs: [39, 79, 119, 159, 199]
    overrides:
      loss.name: mse

  - group: static_wavelet
    tier: 1
    eval_epochs: [39, 79, 119, 159, 199]
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 0.0        # p=0: fixed weights, no temporal adaptation
      loss.wavelet_type: db1

  - group: awwl
    tier: 1
    eval_epochs: [39, 79, 119, 159, 199]
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 1.0
      loss.wavelet_type: db1

  # ---------------------------------------------------------------- tier 2
  # The confounds. Each of these isolates one thing the current manuscript
  # leaves entangled.

  # Total weight held at 1 for every sigma. If AWWL's advantage survives this,
  # it really is a frequency effect; if it disappears, alpha was acting as a
  # Min-SNR-style timestep reweighting and the "resolution law" in the
  # conclusion needs rewriting. This single comparison is the highest-value
  # experiment in the file.
  - group: awwl_normalized
    tier: 2
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 1.0
      loss.normalize_weights: true

  # The arm above is NOT a clean ablation on its own: the published total
  # averages 0.5 over the schedule, so normalising it to 1.0 also doubles the
  # mean gradient magnitude. Any difference then confounds "shape of the
  # weighting" with "twice the learning rate".
  #
  # This holds the average at 0.5, so only the shape changes. Compare against
  # `awwl`, and read the pair together: if both lose to MSE, the frequency
  # weighting itself is what hurts; if only the unmatched one loses, the
  # earlier result was a learning-rate artefact.
  - group: awwl_norm_matched
    tier: 2
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 1.0
      loss.normalize_weights: true
      loss.normalize_scale: 0.5

  # The objective as eq. (7) actually writes it (detail bands summed, not
  # averaged). Reconciles the paper with the released code.
  - group: awwl_eq7
    tier: 2
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 1.0
      loss.detail_reduction: sum

  # EMA arm. Published DDPM CIFAR-10 FIDs (~3) come from EMA weights; these
  # runs sit near 17 without it. Three seeds is enough to see whether EMA
  # preserves the ordering of the losses or flattens it — if it flattens it,
  # every conclusion drawn from non-EMA runs is about optimiser noise.
  - group: mse_ema
    tier: 2
    seeds: [1, 2, 3]
    overrides:
      loss.name: mse
      train.use_ema: true

  - group: awwl_ema
    tier: 2
    seeds: [1, 2, 3]
    overrides:
      loss.name: adaptive_wavelet
      loss.alpha: 0.2
      loss.power: 1.0
      train.use_ema: true

  # ---------------------------------------------------------------- tier 3
  # The rest of Table 2, so the published comparison itself gets error bars.

  - group: l1
    tier: 3
    overrides:
      loss.name: l1

  - group: huber
    tier: 3
    overrides:
      loss.name: huber

  - group: charbonnier
    tier: 3
    overrides:
      loss.name: charbonnier

  - group: snr_weighted
    tier: 3
    overrides:
      loss.name: snr_weighted

  # Min-SNR-gamma (Hang et al. 2023), which `snr_weighted` above is NOT.
  #
  # `snr_weighted` applies the raw ratio a_t/(1-a_t). On this schedule that
  # peaks at 9997 and spans 2.5e8, putting 95% of the gradient mass in the
  # lowest 5% of timesteps -- which is why that arm ends at FID 325 rather
  # than training. Min-SNR clamps the ratio at gamma, so the weight is
  # bounded by 1. The two are different objectives and the paper must not
  # cite Hang et al. for the raw one.
  #
  # This arm exists so the timestep axis is represented by a method that
  # actually trains. 5 runs, ~14 GPU-hours.
  - group: min_snr
    tier: 3
    overrides:
      loss.name: min_snr
      loss.snr_gamma: 5.0

  # The stronger form of the confound control.
  #
  # `awwl_norm_matched` holds the summed band weight at 0.5, which is what the
  # loss scales with. The optimiser sees the gradient, and for
  # L = sum_b w_b ||r_b||^2 that scales with sum_b w_b^2 -- the weights enter
  # squared. Measured over the schedule, pinning the sum leaves sum w^2 varying
  # 4x (scripts/verify_loss_math.py, check 6), so that arm separates shape from
  # *summed* magnitude and not from the size of the update.
  #
  # This arm pins sum w^2 instead, at 0.2454, the published weighting's own
  # mean. The two are complementary rather than nested: each flattens what the
  # other leaves varying, and an effect that survives both belongs to the
  # weighting's shape.
  #
  # 5 runs, ~14 GPU-hours. Uncompiled: it joins the phase0 table.
  - group: awwl_grad_matched
    tier: 2
    overrides:
      loss.name: wavelet_subband
      loss.alpha: 0.2
      loss.power: 1.0
      loss.wavelet_type: db1
      loss.normalize_weights: true
      loss.normalize_scale: 0.2454
      loss.normalize_order: 2.0

  # The gradient-scale control above is built on wavelet_subband, which gives
  # each of the three detail bands the full w_det (share_detail_budget unset)
  # and sums them: the conference Eq.(7) shape, 3x the published detail/LL
  # ratio at every sigma, which costs +2.63 FID on its own (awwl_eq7). It
  # therefore changed two things at once -- the pinned norm and the band shape
  # -- and cannot isolate either. This arm is the control as intended: the
  # published mean-form shape (share_detail_budget: true reproduces
  # adaptive_wavelet's detail_reduction=mean exactly; HH/LL checked equal at
  # every sigma), with sum_b w_b^2 pinned at the published weighting's own
  # mean over the training schedule, E_t[w_LL^2 + w_det^2/3] = 0.0530.
  # Uncompiled, like every other phase0 arm. 5 runs, ~15 GPU-hours.
  # AWWL's timestep component alone. By Proposition 2 the published loss is
  # S(sigma) * MSE plus a zero-sum shape term, S = w_LL + w_det. This arm keeps
  # S * MSE and drops the shape term, so AWWL minus this arm is the effect of
  # the frequency shape at AWWL's own effective timestep total, and this arm
  # minus MSE is the effect of AWWL's timestep schedule. Uncompiled like every
  # other phase0 arm. 5 runs, ~15 GPU-hours.
  # Planted-mechanism control for the pricing test's identifying assumption.
  # MSE trained on CIFAR-10 images that carry AWWL's measured spectral change
  # (the seed-mean of profile(awwl) - profile(mse) at epoch 199, per integer
  # radius, applied per channel in floating point by awwl.data.cifar10.RadialGain;
  # configs/data_awwl_planted_gain_db.json). Its only difference from MSE is a
  # spectral change delivered through training, so pricing it asks whether a
  # filter-made change is valued like the same change made by training: if so,
  # its MRG is zero. Uncompiled like every phase0 arm. 5 runs, ~15 GPU-hours.
  - group: mse_planted
    tier: 2
    overrides:
      loss.name: mse
      data.spectral_gain_db: [0.04552, -0.03745, 0.00255, 0.02217, 0.05806, 0.09262, 0.12273, 0.14463, 0.16982, 0.18922, 0.21367, 0.23066, 0.25445, 0.27209, 0.28493, 0.2903, 0.31157, 0.34417, 0.37046, 0.41363, 0.41109, 0.39079, 0.40144]

  - group: awwl_timestep
    tier: 2
    overrides:
      loss.name: awwl_timestep
      loss.alpha: 0.2
      loss.power: 1.0

  - group: awwl_grad_matched_mean
    tier: 2
    overrides:
      loss.name: wavelet_subband
      loss.alpha: 0.2
      loss.power: 1.0
      loss.wavelet_type: db1
      loss.share_detail_budget: true
      loss.normalize_weights: true
      loss.normalize_scale: 0.0530
      loss.normalize_order: 2.0

  # A second published member of the frequency-aware family. Everything else
  # in this manifest is the audited objective or a variant of it, so the
  # paper's family-level claims rest on one instance; this is the cheapest
  # second one.
  #
  # It differs from the audited objective on both axes that matter: Fourier
  # basis rather than wavelet, and weights keyed on the current error rather
  # than on sigma. Its unweighted limit (ffl_alpha=0) is exactly the pixel
  # MSE by Parseval, which is the only control it admits -- there is no
  # parameter separating its weighting's shape from its total, so the
  # budget-held-fixed protocol has nothing to hold.
  #
  # 5 runs, ~14 GPU-hours.
  - group: focal_frequency
    tier: 3
    overrides:
      loss.name: focal_frequency
      loss.ffl_alpha: 1.0        # the value Jiang et al. use

  # Dropped, and the reasons are worth keeping written down.
  #
  # Cost: at resize=True it upsamples a 32x32 batch 49-fold and pushes it
  # through VGG-16 twice per step. Measured on the GPU that ran it, the loss
  # held ~21 GB against the ~0.24 GB of the UNet it was training -- roughly a
  # hundred times the memory of the model, and a few hundred times its compute.
  # Five seeds of that is days of GPU time.
  #
  # Meaning: the trainer calls the loss on (predicted_noise, noise). The
  # epsilon target is white Gaussian noise and has no perceptual content, so
  # VGG activations of it measure nothing the name suggests. Whatever number
  # came back would have to be captioned in the paper as a control rather than
  # a perceptual result, which is a poor trade for days of compute.
  #
  # The row is simply absent from the table. That is more honest than a number
  # nobody can interpret, and the reasoning above is the paper's to state.
  # - group: perceptual
  #   tier: 5
  #   overrides:
  #     loss.name: perceptual

  # ---------------------------------------------------------------- tier 4
  # The method extensions (A1-A4). Each turns on exactly ONE axis so its
  # contribution is separately attributable; `awwl_full` composes them.
  #
  # Read these against `awwl_normalized` from tier 2, not against `awwl`.
  # The extension losses hold the summed weight at 1 for every sigma, so
  # comparing them to the un-normalised published objective would confound the
  # extension with the gradient-magnitude schedule that normalisation removes.
  #
  # 31 runs, roughly 2 days on 2 GPUs. Only worth spending once tiers 1-2
  # have said whether there is an effect here to extend at all.
  #
  # Split across two tiers by what they answer, not by what they cost:
  #
  #   tier 4 (10 runs) -- awwl_learned and awwl_gradnorm. These decide whether
  #     a learned weighting removes the need to choose alpha and p at all,
  #     which is the question the section exists to answer. Run these first:
  #     `--max-tier 4` finishes them in a third of the time, so a schedule that
  #     runs out still has the result the paper needs.
  #
  #   tier 5 (21 runs) -- per-direction powers, depth, spatial adaptivity, a
  #     learned basis, and all of it at once. These broaden the finding rather
  #     than establish it, and awwl_full is only interpretable once its
  #     components have reported.
  #
  # Nothing about the runs themselves changed; epochs, sample count and
  # sampler stay identical to tiers 1-3, because a table that mixes those is
  # not a comparison.

  # A1 -- does the diagonal band need a steeper schedule than LH/HL?
  - group: awwl_subband
    tier: 5
    overrides:
      loss.name: wavelet_subband
      loss.alpha: 0.2
      loss.power: 1.0
      loss.direction_powers: {hh: 2.0}

  # A1 -- 3-level decomposition, matching what Fig. 1 of the paper illustrates
  # but the method never used. share_detail_budget keeps the detail mass fixed
  # so this measures depth, not a larger detail term.
  - group: awwl_multilevel
    tier: 5
    overrides:
      loss.name: wavelet_subband
      loss.levels: 3
      loss.alpha: 0.2
      loss.power: 1.0
      loss.share_detail_budget: true

  # A2 -- weights vary over image position, strongest in the detail phase.
  - group: awwl_spatial
    tier: 5
    overrides:
      loss.name: wavelet_spatial
      loss.alpha: 0.2
      loss.power: 1.0
      loss.strength: 1.0

  # A3 -- the curriculum is learned from sigma rather than assumed to be
  # sigma^p. This is the run that decides whether alpha and p are needed at all.
  - group: awwl_learned
    tier: 4
    overrides:
      loss.name: wavelet_learned
      loss.conditioned: true
      train.loss_learning_rate: 1.0e-3

  # A3 -- GradNorm, the scheme the paper cites but never implemented.
  - group: awwl_gradnorm
    tier: 4
    overrides:
      loss.name: wavelet_gradnorm
      loss.gradnorm_asymmetry: 1.5
      train.loss_learning_rate: 2.5e-2

  # A4 -- learnable basis. Starts at Haar, so any gain is from the learning.
  - group: awwl_lifting
    tier: 5
    seeds: [1, 2, 3]
    overrides:
      loss.name: wavelet_lifting
      loss.alpha: 0.2
      loss.power: 1.0
      train.loss_learning_rate: 1.0e-4

  # Everything at once: learned weights, spatially adaptive, learned basis.
  - group: awwl_full
    tier: 5
    seeds: [1, 2, 3]
    overrides:
      loss.name: wavelet_learned
      loss.conditioned: true
      loss.spatial: true
      loss.strength: 1.0
      loss.transform: lifting
      train.loss_learning_rate: 1.0e-3
